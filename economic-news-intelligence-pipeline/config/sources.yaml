  # Search-based discovery is useful for Pakistan-focused stories from global sources.
  - name: Pakistan Economy Topic
    method: google_news_rss
    category: domestic
    query: '(Pakistan OR Pakistani OR PKR OR "State Bank of Pakistan" OR SBP) (economy OR inflation OR GDP OR budget OR trade OR exports OR imports OR remittances)'
    source_weight: 8
    source_group: google_topic_pk
    topic_group: topic_pakistan_economy
    source_type: core
    tags: [Pakistan, macroeconomics, inflation, trade, policy]
    timezone: Asia/Karachi

  - name: Pakistan Markets Topic
    method: google_news_rss
    category: domestic
    query: '(Pakistan OR PSX OR "KSE-100") (stocks OR shares OR market OR listed companies OR banking OR earnings)'
    source_weight: 8
    source_group: google_topic_pk
    topic_group: topic_pakistan_markets
    source_type: core
    tags: [PSX, KSE-100, equities, corporate results]
    timezone: Asia/Karachi

  - name: Pakistan IMF and Debt Topic
    method: google_news_rss
    category: domestic
    query: 'Pakistan (IMF OR "Extended Fund Facility" OR sovereign debt OR external financing OR Eurobond OR Sukuk OR fiscal deficit)'
    source_weight: 9
    source_group: google_topic_pk
    topic_group: topic_pakistan_debt
    source_type: core
    tags: [IMF, sovereign debt, financing, fiscal policy]
    timezone: Asia/Karachi

  - name: Pakistan Energy Topic
    method: google_news_rss
    category: domestic
    query: 'Pakistan (electricity tariff OR gas tariff OR circular debt OR petroleum levy OR LNG OR power sector)'
    source_weight: 8
    source_group: google_topic_pk
    topic_group: topic_pakistan_energy
    source_type: core
    tags: [energy, tariffs, circular debt, petroleum]
    timezone: Asia/Karachi

  - name: Pakistan Trade and Industry Topic
    method: google_news_rss
    category: domestic
    query: 'Pakistan (textile exports OR IT exports OR agriculture OR cotton OR cement OR automobiles OR manufacturing OR foreign investment)'
    source_weight: 7
    source_group: google_topic_pk
    topic_group: topic_pakistan_industry
    source_type: core
    tags: [exports, textiles, IT, agriculture, industry, investment]
    timezone: Asia/Karachi

