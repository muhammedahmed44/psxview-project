  # Official Pakistani data and policy sources. HTML collection support must be verified per site.
  - name: State Bank of Pakistan Press Releases
    method: html
    category: domestic
    url: https://www.sbp.org.pk/press-release/
    source_weight: 10
    source_group: sbp
    source_type: core
