services:
  - type: web
    name: psxviewai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psxviewai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: psxviewai-db
    plan: free
    region: singapore
    databaseName: psxviewai
    user: psxviewai
